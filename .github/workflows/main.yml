name: Esteira de CI/CD - MechanicLtda (aplicacao)

# Este repositorio cuida apenas da APLICACAO: build, testes e publicacao das
# imagens Docker no ECR. A infraestrutura (Terraform) e os manifestos do
# Kubernetes vivem em repositorios separados:
#   - Fiap-Mecanic-Ltda/InfraKubernete  (VPC, EC2/k3s, ECR, IAM/OIDC + k8s/)
#   - repositorio de infra do banco gerenciado (RDS)
# O deploy no cluster e feito la (workflow "Deploy no Kubernetes"), que resolve
# sozinho a ultima imagem publicada aqui no ECR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"
  # Precisam bater com os defaults de infra/variables.tf do repositorio
  # InfraKubernete (aws_region, project_name, environment).
  AWS_REGION: us-east-1
  PROJECT_NAME: mechanicltda
  ENVIRONMENT: prod

permissions:
  contents: read
  # Necessario para o OIDC do GitHub assumir a role da AWS (sem access keys
  # estaticas como secret do repositorio).
  id-token: write

jobs:
  # ── 1. Build da aplicação + 2. Testes automatizados ──────────────────────
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MechanicLtda.sln

      - name: Build
        run: dotnet build MechanicLtda.sln --configuration Release --no-restore

      - name: Testes automatizados
        run: dotnet test MechanicLtda.sln --configuration Release --no-build --verbosity normal

  # Confirma se a role de OIDC (provisionada pelo Terraform no repositorio de
  # infra) ja existe antes de tentar autenticar. Sem isso, um push antes do
  # primeiro apply falharia com erro de credencial em vez de pular o job com
  # uma mensagem clara.
  check-infra-ready:
    name: Verifica se a role de OIDC ja foi provisionada
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Configura credenciais AWS (chave estatica do terraform-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checa a role do GitHub Actions
        id: check
        run: |
          ROLE_NAME="${PROJECT_NAME}-${ENVIRONMENT}-github-actions"
          if aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Role '$ROLE_NAME' ainda nao existe - rode o workflow terraform.yml (apply) no repositorio InfraKubernete primeiro. Pulando o build/push da imagem."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 3. Build e push das imagens Docker (API e Web) para o ECR ────────────
  docker-build-push:
    name: Build e push das imagens no ECR
    needs: [build-and-test, check-infra-ready]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-infra-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MechanicLtda.API/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-api:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push da imagem do Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MechanicLtda.Web/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-web:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O deploy roda no repositorio de infra (nao ha dispatch entre repos, para
      # nao precisar de um PAT como secret aqui).
      - name: Como publicar no cluster
        run: |
          echo "::notice::Imagens publicadas com a tag ${{ github.sha }}. Para levar ao cluster, rode o workflow 'Deploy no Kubernetes' em https://github.com/Fiap-Mecanic-Ltda/InfraKubernete/actions"
