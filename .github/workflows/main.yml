name: Esteira de CI/CD - MechanicLtda

# Testes rodam em qualquer push/PR; build de imagem e deploy só acontecem
# em push na main (mesma regra de ouro da esteira de referência).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"

permissions:
  contents: read
  # Necessário para o OIDC do GitHub assumir a role da AWS (sem access keys
  # estáticas como secret do repositório).
  id-token: write

jobs:
  # Lê o default de aws_region direto do Terraform, para não duplicar esse
  # valor como Repository Variable no GitHub (fonte única de verdade).
  read-tf-vars:
    name: Lê variáveis padrão do Terraform
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      aws_region: ${{ steps.vars.outputs.aws_region }}
      project_name: ${{ steps.vars.outputs.project_name }}
      environment: ${{ steps.vars.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrai defaults do variables.tf
        id: vars
        run: |
          for name in aws_region project_name environment; do
            value=$(awk "/variable \"$name\"/,/^}/" infra/variables.tf | grep default | sed -E 's/.*default[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/')
            if [ -z "$value" ]; then
              echo "::error::Não encontrei o default de $name em infra/variables.tf"
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_OUTPUT"
          done

  # ── Terraform: provisiona a infraestrutura da AWS (infra/) ───────────────
  # Usa a chave estática do terraform-deployer (já configurada como secret),
  # não OIDC: a role de OIDC (github_oidc.tf) é criada POR este apply, então
  # o CI ainda não tem como assumi-la na primeira execução (bootstrap).
  terraform-changes:
    name: Detecta mudanças no Terraform
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'

  terraform-plan:
    name: Terraform plan
    needs: [terraform-changes, read-tf-vars]
    if: needs.terraform-changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_ec2_key_pair_name: mechanicltda-prod
      TF_VAR_db_engine_version: "15.00.4430.1.v1"
      TF_VAR_db_master_password: ${{ secrets.SA_PASSWORD }}
      TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
      TF_VAR_encryption_cpf_cnpj_key: ${{ secrets.ENCRYPTION_KEY }}
      TF_VAR_email_password: ${{ secrets.EMAIL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Configura credenciais AWS (chave estática do terraform-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.read-tf-vars.outputs.aws_region }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.10'

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false

  terraform-apply:
    name: Terraform apply
    needs: [terraform-plan, read-tf-vars]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_ec2_key_pair_name: mechanicltda-prod
      TF_VAR_db_engine_version: "15.00.4430.1.v1"
      TF_VAR_db_master_password: ${{ secrets.SA_PASSWORD }}
      TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
      TF_VAR_encryption_cpf_cnpj_key: ${{ secrets.ENCRYPTION_KEY }}
      TF_VAR_email_password: ${{ secrets.EMAIL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Configura credenciais AWS (chave estática do terraform-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.read-tf-vars.outputs.aws_region }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.10'

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

  # Confirma se a role de OIDC (criada pelo terraform-apply) já existe antes
  # de deixar docker-build-push/deploy tentarem autenticar via OIDC. Usa a
  # mesma chave estática do terraform-deployer (não depende da própria role
  # que está checando). Sem isso, um push antes do primeiro apply falharia
  # com erro de credencial em vez de pular os jobs de forma clara.
  check-infra-ready:
    name: Verifica se a role de OIDC já foi provisionada
    needs: read-tf-vars
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Configura credenciais AWS (chave estática do terraform-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.read-tf-vars.outputs.aws_region }}

      - name: Checa a role do GitHub Actions
        id: check
        run: |
          ROLE_NAME="${{ needs.read-tf-vars.outputs.project_name }}-${{ needs.read-tf-vars.outputs.environment }}-github-actions"
          if aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Role '$ROLE_NAME' ainda não existe — rode o workflow manualmente (workflow_dispatch) para provisionar a infra primeiro. Pulando docker-build-push/deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 1. Build da aplicação + 2. Testes automatizados ──────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MechanicLtda.sln

      - name: Build
        run: dotnet build MechanicLtda.sln --configuration Release --no-restore

      - name: Testes automatizados
        run: dotnet test MechanicLtda.sln --configuration Release --no-build --verbosity normal

  # ── 3. Build e push da imagem Docker (API e Web) para o ECR ──────────────
  docker-build-push:
    needs: [build-and-test, read-tf-vars, check-infra-ready]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-infra-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ needs.read-tf-vars.outputs.aws_region }}

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MechanicLtda.API/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/mechanicltda-api:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/mechanicltda-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push da imagem do Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MechanicLtda.Web/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/mechanicltda-web:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/mechanicltda-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4/5/6. Deploy no k3s da EC2 via SSM Run Command ───────────────────────
  # Não há kubeconfig exposto publicamente: a pipeline nunca fala diretamente
  # com a API do k3s (porta 6443 fechada no security group). Em vez disso,
  # manda o manifesto renderizado para dentro da instância via SSM e roda
  # `kubectl apply` localmente lá, reaproveitando o mesmo IAM/SSM usado para
  # acesso administrativo (sem SSH).
  deploy:
    needs: [docker-build-push, read-tf-vars]
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
      ECR_REGISTRY: ${{ needs.docker-build-push.outputs.ecr_registry }}
      AWS_REGION: ${{ needs.read-tf-vars.outputs.aws_region }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Busca o Instance ID pela tag Name em vez de um secret fixo: o ID muda
      # toda vez que a instância é substituída (ex: mudança em user_data).
      - name: Descobre o Instance ID atual
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ needs.read-tf-vars.outputs.project_name }}-${{ needs.read-tf-vars.outputs.environment }}-api" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::Não encontrei uma instância EC2 rodando com a tag Name esperada."
            exit 1
          fi
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # 4/6. Renderiza os manifestos de produção (Namespace, ConfigMap, API,
      # Web, Services NodePort, HPA) já com as imagens recém publicadas.
      - name: Renderiza os manifestos (kustomize) com as imagens publicadas
        run: |
          cp -r k8s /tmp/prod-render
          cat >> /tmp/prod-render/overlays/prod/kustomization.yaml <<EOF
          images:
            - name: mechanicltda-api
              newName: ${ECR_REGISTRY}/mechanicltda-api
              newTag: ${IMAGE_TAG}
            - name: mechanicltda-web
              newName: ${ECR_REGISTRY}/mechanicltda-web
              newTag: ${IMAGE_TAG}
          EOF
          kubectl kustomize /tmp/prod-render/overlays/prod > /tmp/app-manifests.yaml

      # 5. Segredos reais nunca ficam no YAML versionado — busca no SSM
      # Parameter Store (alimentado pelo Terraform a partir de terraform.tfvars)
      # e monta o Secret em runtime, igual à seção 8.4 da esteira de referência.
      - name: Monta o Secret a partir do SSM Parameter Store
        run: |
          PREFIX="/mechanicltda/prod"
          get_param() { aws ssm get-parameter --name "$1" --with-decryption --query 'Parameter.Value' --output text; }

          kubectl create secret generic mechanicltda-secrets \
            --namespace mechanicltda \
            --from-literal=ConnectionStrings__DefaultConnection="$(get_param $PREFIX/db-connection-string)" \
            --from-literal=JWT_SECRET_KEY="$(get_param $PREFIX/jwt-secret-key)" \
            --from-literal=ENCRYPTION_KEY="$(get_param $PREFIX/encryption-key)" \
            --from-literal=EmailSettings__Password="$(get_param $PREFIX/email-password)" \
            --from-literal=AppSettings__BaseUrlAprovacao="$(get_param $PREFIX/app-base-url-aprovacao)" \
            --dry-run=client -o yaml > /tmp/secret-manifest.yaml

          # "---" é obrigatório entre documentos concatenados manualmente -
          # sem ele, "kubectl apply -f -" processa só o último documento do
          # stream e ignora os anteriores em silêncio (sem erro nenhum, foi
          # por isso que "mechanicltda-secrets" nunca era atualizado de
          # verdade: só "ecr-creds", que vinha depois, era aplicado).
          echo "---" >> /tmp/secret-manifest.yaml

          kubectl create secret docker-registry ecr-creds \
            --namespace mechanicltda \
            --docker-server="${ECR_REGISTRY}" \
            --docker-username=AWS \
            --docker-password="$(aws ecr get-login-password --region "$AWS_REGION")" \
            --dry-run=client -o yaml >> /tmp/secret-manifest.yaml

      - name: Envia os manifestos para a instância via SSM e aplica
        run: |
          # Os manifestos vao pro S3 em vez de embutidos inline no comando do
          # SSM: o payload em base64 (~11KB) estourava os limites praticos do
          # SSM Run Command - o comando era aceito (ganhava CommandId) mas
          # travava "InProgress" pra sempre, sem output nenhum.
          #
          # App e Secrets vao em DOIS "kubectl apply" separados (dois arquivos
          # no S3, dois comandos na mesma chamada do SSM): aplicar tudo junto
          # num unico stream (HPA + Secret misturados) corrompia o patch
          # calculado pro ultimo recurso - erro real reproduzido manualmente:
          # "unknown field spec" ao atualizar o Secret ecr-creds, com campos
          # vazados de um HorizontalPodAutoscaler. Comportamento visto tanto
          # via SSM quanto aplicando local via SSH, entao nao e limitacao do
          # SSM - splitar em duas chamadas de apply resolveu nos dois casos.
          APP_KEY="deploy/app-${{ github.sha }}.yaml"
          SECRET_KEY="deploy/secret-${{ github.sha }}.yaml"
          aws s3 cp /tmp/app-manifests.yaml "s3://mechanicltda-terraform-state-430606112709/${APP_KEY}"
          aws s3 cp /tmp/secret-manifest.yaml "s3://mechanicltda-terraform-state-430606112709/${SECRET_KEY}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"export KUBECONFIG=/etc/rancher/k3s/k3s.yaml\",\"aws s3 cp s3://mechanicltda-terraform-state-430606112709/${APP_KEY} - | /usr/local/bin/kubectl apply -f -\",\"aws s3 cp s3://mechanicltda-terraform-state-430606112709/${SECRET_KEY} - | /usr/local/bin/kubectl apply -f -\"]}" \
            --query "Command.CommandId" --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_ENV"

          # Aguarda o comando terminar antes de checar o resultado.
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" > /tmp/invocation.json

          cat /tmp/invocation.json

          aws s3 rm "s3://mechanicltda-terraform-state-430606112709/${APP_KEY}" || true
          aws s3 rm "s3://mechanicltda-terraform-state-430606112709/${SECRET_KEY}" || true

          STATUS=$(python3 -c "import json;print(json.load(open('/tmp/invocation.json'))['Status'])")
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Falha ao aplicar os manifestos via SSM (status: $STATUS)"
            exit 1
          fi

      # Aguarda o rollout terminar sem derrubar o serviço (mesmo princípio do
      # readinessProbe citado na esteira de referência).
      - name: Aguarda o rollout via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["export KUBECONFIG=/etc/rancher/k3s/k3s.yaml","/usr/local/bin/kubectl rollout status deployment/mechanicltda-api -n mechanicltda --timeout=300s","/usr/local/bin/kubectl rollout status deployment/mechanicltda-web -n mechanicltda --timeout=300s"]}' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" > /tmp/rollout.json

          cat /tmp/rollout.json
          STATUS=$(python3 -c "import json;print(json.load(open('/tmp/rollout.json'))['Status'])")
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Rollout não completou a tempo (status: $STATUS)"
            exit 1
          fi