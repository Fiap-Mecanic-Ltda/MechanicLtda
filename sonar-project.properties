sonar.projectKey=MechanicLtda
sonar.projectName=MechanicLtda
sonar.projectVersion=1.0.0
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Migrations sao geradas pelo EF Core (Designer.cs / Model snapshot) - nao devem ser
# analisadas por duplicacao (CPD), pois repetem o modelo inteiro a cada migration.
sonar.cpd.exclusions=**/Migrations/**

# Coverage
sonar.coverageReportPaths=coverage/SonarQubeCoverage.xml
sonar.cs.opencover.reportsPaths=coverage/SonarQubeCoverage.xml
