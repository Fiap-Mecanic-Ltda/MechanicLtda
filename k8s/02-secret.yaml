# ⚠️ Segredos de exemplo — NÃO use estes valores nem comite valores reais neste arquivo.
#
# Formas recomendadas de popular este Secret em vez de editar os valores abaixo:
#
#   kubectl create secret generic mechanicltda-secrets \
#     --namespace mechanicltda \
#     --from-literal=SA_PASSWORD='<senha-forte>' \
#     --from-literal=JWT_SECRET_KEY='<chave-jwt-min-32-chars>' \
#     --from-literal=ENCRYPTION_KEY='<chave-criptografia-min-32-chars>' \
#     --from-literal=ConnectionStrings__DefaultConnection='Server=mechanicltda-sqlserver;Database=MechanicLtdaDb;User Id=sa;Password=<senha-forte>;TrustServerCertificate=True;'
#
# Ou, em produção, prefira um provedor externo (Sealed Secrets, External Secrets
# Operator, Azure Key Vault / AWS Secrets Manager via CSI driver etc.) em vez de
# Secrets nativos do Kubernetes puros (que são apenas base64, não criptografados).
apiVersion: v1
kind: Secret
metadata:
  name: mechanicltda-secrets
  namespace: mechanicltda
  labels:
    app.kubernetes.io/part-of: mechanicltda
type: Opaque
stringData:
  SA_PASSWORD: "CHANGE_ME_StrongPassword123!"
  JWT_SECRET_KEY: "CHANGE_ME_jwt_secret_key_min_32_characters"
  ENCRYPTION_KEY: "CHANGE_ME_encryption_key_min_32_characters"
  ConnectionStrings__DefaultConnection: "Server=mechanicltda-sqlserver;Database=MechanicLtdaDb;User Id=sa;Password=CHANGE_ME_StrongPassword123!;TrustServerCertificate=True;"
