apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanicltda-api
  namespace: mechanicltda
  labels:
    app.kubernetes.io/part-of: mechanicltda
    app.kubernetes.io/name: api
spec:
  # O HPA (api-hpa.yaml) controla o número de réplicas em execução; este valor
  # só vale enquanto o HPA ainda não calculou uma recomendação.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: mechanicltda-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: mechanicltda-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: ConnectionStrings__DefaultConnection
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: JWT_SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: JWT_SECRET_KEY
            - name: Encryption__CpfCnpjKey
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: ENCRYPTION_KEY
            - name: EmailSettings__Password
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: EmailSettings__Password
            - name: AppSettings__BaseUrlAprovacao
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: AppSettings__BaseUrlAprovacao
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
