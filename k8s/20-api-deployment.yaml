apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanicltda-api
  namespace: mechanicltda
  labels:
    app.kubernetes.io/part-of: mechanicltda
    app.kubernetes.io/name: api
spec:
  # O HPA (22-api-hpa.yaml) controla o número de réplicas em execução; este valor
  # só vale enquanto o HPA ainda não calculou uma recomendação.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      # Aguarda o SQL Server aceitar conexões antes de iniciar a API — reproduz o
      # "depends_on: condition: service_healthy" do docker-compose, que não tem
      # equivalente nativo em Deployments do Kubernetes.
      initContainers:
        - name: wait-for-sqlserver
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z -w2 mechanicltda-sqlserver 1433; do echo "aguardando sqlserver..."; sleep 2; done
      containers:
        - name: api
          image: mechanicltda-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: mechanicltda-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: ConnectionStrings__DefaultConnection
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: JWT_SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: JWT_SECRET_KEY
            - name: Encryption__CpfCnpjKey
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: ENCRYPTION_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
