apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanicltda-web
  namespace: mechanicltda
  labels:
    app.kubernetes.io/part-of: mechanicltda
    app.kubernetes.io/name: web
spec:
  # O HPA (32-web-hpa.yaml) controla o número de réplicas em execução; este valor
  # só vale enquanto o HPA ainda não calculou uma recomendação.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      # Aguarda a API ficar healthy (mesma ordem do docker-compose: sqlserver → api → web).
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -q -T2 -O- http://mechanicltda-api:8080/health; do echo "aguardando api..."; sleep 2; done
      containers:
        - name: web
          image: mechanicltda-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: mechanicltda-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: ConnectionStrings__DefaultConnection
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: JWT_SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: JWT_SECRET_KEY
            - name: Encryption__CpfCnpjKey
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: ENCRYPTION_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
