services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mechanicltda-sqlserver
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${SA_PASSWORD} -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 30
      # A primeira subida cria tempdb/msdb do zero (sem o volume ainda populado) e pode
      # demorar bem mais que isso em máquinas mais lentas — sem start_period, o Docker
      # começa a contar falhas imediatamente e pode marcar o serviço como unhealthy antes
      # do SQL Server terminar de inicializar, travando api/web (que dependem dele).
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: src/MechanicLtda.API/Dockerfile
    container_name: mechanicltda-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=MechanicLtdaDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=MechanicLtda.API
      - JwtSettings__IssuerCpf=MechanicLtda.Auth.Cpf
      - JwtSettings__Audience=MechanicLtda.Clients
      - JwtSettings__ExpiracaoMinutos=60
      - Encryption__CpfCnpjKey=${ENCRYPTION_KEY}
      - Encryption__CpfCnpjHashKey=${CPF_HASH_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - EmailSettings__Password=${EMAIL_PASSWORD}
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: src/MechanicLtda.Web/Dockerfile
    container_name: mechanicltda-web
    ports:
      - "8090:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=MechanicLtdaDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=MechanicLtda.API
      - JwtSettings__IssuerCpf=MechanicLtda.Auth.Cpf
      - JwtSettings__Audience=MechanicLtda.Clients
      - JwtSettings__ExpiracaoMinutos=60
      - Encryption__CpfCnpjKey=${ENCRYPTION_KEY}
      - Encryption__CpfCnpjHashKey=${CPF_HASH_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - EmailSettings__Password=${EMAIL_PASSWORD}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  sqlserver_data: