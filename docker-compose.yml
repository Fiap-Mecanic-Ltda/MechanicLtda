services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mechanicltda-sqlserver
    environment:
      SA_PASSWORD: "MechanicLtda@2024"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P MechanicLtda@2024 -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/MechanicLtda.API/Dockerfile
    container_name: mechanicltda-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=MechanicLtdaDb;User Id=sa;Password=MechanicLtda@2024;TrustServerCertificate=True;
      - JwtSettings__SecretKey=SuaChaveJwtSuperSecreta_MechanicLtda_2024!
      - JwtSettings__Issuer=MechanicLtda.API
      - JwtSettings__Audience=MechanicLtda.Clients
      - JwtSettings__ExpiracaoMinutos=60
      - Encryption__CpfCnpjKey=ChaveCriptografiaCpfCnpj_32Chars!!
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver_data: